# Render Blueprint - free API deployment
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: raillens-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: NTES_TIMEOUT
        value: "30"
      - key: NTES_RETRIES
        value: "3"
      - key: CORS_ORIGINS
        value: "*"
