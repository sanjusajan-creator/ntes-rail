# Render Blueprint - free API deployment
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: raillens-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    buildCommand: ""
    startCommand: ""
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: RAIL_ENGINE_API_KEY
        sync: false
      - key: NTES_TIMEOUT
        value: "30"
      - key: NTES_RETRIES
        value: "3"
      - key: CORS_ORIGINS
        value: "*"
